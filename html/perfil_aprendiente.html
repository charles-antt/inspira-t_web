<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mi perfil | inspira-T</title>
        <link rel="icon" href="../assiest/images/isotipo_blanco.png">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../assiest/css/styles.css">
        <link rel="stylesheet" href="../assiest/css/app.css">
    </head>
    <body class="app" data-page="perfil_aprendiente.html" data-role="aprendiente">
    <aside class="sidebar">
        <div class="brand">
            <img src="../assiest/images/isotipo_blanco.png" alt="">inspira-T
        </div>
        <nav><a href="../html/inicio_aprendiente.html" class="">Inicio</a><a href="../html/explorar.html" class="">Explorar</a><a href="../html/mi_aprendizaje.html" class="">Mi aprendizaje</a><a href="../html/mis_cursos.html" class="">Mis cursos</a></nav>
        <div class="cta">Comparte tu conocimiento<a href="../html/subir_contenido.html">Quiero ser instructor</a></div>
    </aside>
    <main class="main">
        <div class="topbar">
            <div></div>
            <div class="icons">
                <span class="bell">🔔</span>
                <a href="../html/perfil_aprendiente.html" class="avatar" aria-label="Mi perfil"></a>
            </div>
        </div>
        <div class="profile-head">
            <span class="avatar"></span>
            <p>
                <b id="uname">Nombre de usuario</b>
                <br>
                Aprendiente
            </p>
        </div>
        <div class="box">
            <div style="display:flex;justify-content:space-between">
                <h3>Información personal</h3>
                <button class="btn teal" id="edit">Editar</button>
            </div>
            <div class="row2">
                <div class="field">
                    <label>Nombre completo*</label>
                    <input data-field="Nombre completo" placeholder="Nombre completo">
                </div>
                <div class="field">
                    <label>Nombre de usuario*</label>
                    <input data-field="Nombre de usuario" placeholder="Nombre de usuario">
                </div>
                <div class="field">
                    <label>Correo electrónico*</label>
                    <input data-field="Correo electrónico" placeholder="Correo electrónico">
                </div>
                <div class="field">
                    <label>Número de teléfono*</label>
                    <input data-field="Número de teléfono" placeholder="Número de teléfono">
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="btn" id="save">Guardar</button>
            <a class="btn purple" href="#" data-logout>Cerrar Sesión</a>
        </div>
    </main>
    <script src="../assiest/js/app.js"></script>

</body></html>
