<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | inspira-T</title>

 <link rel="icon" type="image/x-icon" href="../assiest/images/isotipo_blanco.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assiest/css/styles.css"><link rel="stylesheet" href="../assiest/css/app.css">
</head>
<body>
  <main class="login-page">

    <!-- ========== IMÁGENES DECORATIVAS (IZQUIERDA) ========== -->
    <!-- 2) ILUSTRACIÓN PRINCIPAL (abuela y niña tejiendo) -->
    <div class="slot slot--ilustracion slot--limpio" data-nombre="Ilustración principal">
      <img src="../assiest/images/abuela.png" alt="Una abuela enseña a tejer una canasta a su nieta">
    </div>

    <!-- ========== TARJETA DE LOGIN (CENTRO) ========== -->
    <section class="card" aria-labelledby="titulo-login">

      <header class="card__header">
        <!-- 3) LOGO inspira-T (incluye el foco, el nombre y la hoja) -->
        <div class="slot slot--logo slot--limpio" data-nombre="Logo">
          <img src="../assiest/images/logo_frase.png" alt="inspira-T">
        </div>

      </header>

      <form class="form" id="login-form" action="#" method="post" novalidate>

        <div class="field">
          <label for="correo">Correo electronico</label>
          <div class="input">
            <svg class="input__icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3.5 6.5 8.5 7 8.5-7"/>
            </svg>
            <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo electrónico" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input">
            <svg class="input__icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2.5"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
              <circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            <button type="button" class="input__toggle" id="toggle-password" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <a class="link link--olvido" href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21v-1.5A5.5 5.5 0 0 1 9.5 14h5a5.5 5.5 0 0 1 5.5 5.5V21"/>
          </svg>
          Iniciar Sesión
        </button>
      </form>
      <p id="login-msg" role="alert" style="color:#e15353;font-size:.85rem;text-align:center;margin-top:8px"></p>
      <div class="demo-box">Usuarios de ejemplo:<br>
        <button type="button" data-demo="aprendiente">Aprendiente</button><button type="button" data-demo="instructor">Instructor</button><br>
        <small>aprendiente@inspira-t.mx / Aprende123<br>instructor@inspira-t.mx / Instruye123</small></div>

      <p class="registro">
        ¿No tienes cuenta?
        <a class="link" href="../html/registro.html">Registrate aquí</a>
      </p>
    </section>

    <!-- ========== PANEL DERECHO ========== -->

    <!-- 5) PATRÓN BORDADO (esquina inferior derecha) -->
    <div class="slot slot--patron slot--limpio" data-nombre="Patrón">
      <img src="../assiest/images/icono_bordado.png" alt="" aria-hidden="true">
    </div>

  </main>

  <script src="./assiest/js/app.js"></script>
  <script>
    // Mostrar / ocultar contraseña
    const input = document.getElementById('password');
    const toggle = document.getElementById('toggle-password');
    toggle.addEventListener('click', () => {
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      toggle.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });
  </script>
</body>
</html>
