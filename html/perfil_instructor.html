<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | inspira-T</title>
    <link rel="icon" href="../assiest/images/isotipo_blanco.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assiest/css/styles.css">
    <link rel="stylesheet" href="../assiest/css/app.css">
</head>

<body class="app" data-page="perfil_instructor.html" data-role="instructor">
    <!-- Barra lateral izquierda -->
    <div id="sidebar-container"></div>
    <main class="main">
        <!-- Barra superior -->
        <div id="topbar-container"></div>

        <div class="profile-head">
            <div class="avatar-wrapper">
                <span class="avatar">
                    <img src="../assiest/images/instructor_image.svg" alt="Foto de perfil">
                </span>
                <button type="button" class="edit-avatar-btn" title="Cambiar foto de perfil"
                    aria-label="Cambiar foto de perfil">
                    <i data-lucide="pencil"></i>
                </button>
            </div>

            <p>
                <b id="uname">Nombre de usuario</b>
                <br>
                Instructor
            </p>
        </div>
        <div class="box">
            <div style="display:flex;justify-content:space-between">
                <h3>Información personal</h3>
                <button class="btn teal" id="edit">Editar</button>
            </div>
            <div class="row2">
                <div class="field">
                    <label>Nombre completo*</label>
                    <input data-field="Nombre completo" placeholder="Nombre completo">
                </div>
                <div class="field">
                    <label>Nombre de usuario*</label>
                    <input data-field="Nombre de usuario" placeholder="Nombre de usuario">
                </div>
                <div class="field">
                    <label>Correo electrónico*</label>
                    <input data-field="Correo electrónico" placeholder="Correo electrónico">
                </div>
                <div class="field">
                    <label>Número de teléfono*</label>
                    <input data-field="Número de teléfono" placeholder="Número de teléfono">
                </div>
            </div>
            <h3>Información adicional</h3>
            <div class="row2">
                <div class="field">
                    <label>Años de experiencia*</label>
                    <input data-field="Años de experiencia" placeholder="Ej. 6 años">
                </div>
                <div class="field">
                    <label>Ciudad*</label>
                    <input data-field="Ciudad" placeholder="Nombre de la ciudad">
                </div>
                <div class="field">
                    <label>Biografía*</label>
                    <textarea data-field="Biografía" placeholder="Cuéntanos sobre ti..."></textarea>
                </div>
                <div class="field">
                    <label>Frase personal*</label>
                    <textarea data-field="Frase personal" placeholder="Frase que represente tu esencia..."></textarea>
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="btn" id="save">Guardar</button>
            <a class="btn purple" href="#" data-logout>Cerrar Sesión</a>
        </div>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="../js/sidebar.js"></script>
        <script src="../js/topbar.js"></script>

</body>

</html>
