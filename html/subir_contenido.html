<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Subir nuevo contenido | inspira-T</title>
        <link rel="icon" href="../assiest/images/isotipo_blanco.png">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../assiest/css/styles.css">
        <link rel="stylesheet" href="../assiest/css/app.css">
    </head>
    <body class="app" data-page="subir_contenido.html" data-role="instructor">
        <aside class="sidebar">
            <div class="brand"><img src="../assiest/images/isotipo_blanco.png" alt="">inspira-T</div>
            <nav>
                <a href="../html/inicio_instructor.html" class="active">Inicio</a>
            </nav>
        </aside>
        <main class="main">
            <div class="topbar">
                <div>
                    <h1>Subir nuevo contenido</h1>
                    <p>Comparte tus conocimientos ancestrales con nuestra comunidad</p>
                </div>
                <div class="icons">
                    <span class="bell">🔔</span>
                    <a href="../html/perfil_instructor.html" class="avatar" aria-label="Mi perfil"></a>
                </div>
            </div>
            <div class="box">
                <h3>Detalles adicionales</h3>
                <div class="row2">
                    <div class="field">
                        <label>Idioma del video</label>
                        <select>
                            <option value="">Selecciona el idioma</option>
                            <option>Español</option>
                            <option>Zapoteco</option>
                            <option>Náhuatl</option>
                            <option>Maya</option>
                            <option>Mixteco</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Público objetivo</label>
                        <input placeholder="¿A quién va dirigido este contenido?">
                        </input>
                    </div>
                    <div class="field">
                        <label>Nivel de dificultad</label>
                        <select>
                            <option value="">Selecciona el nivel</option>
                            <option>Principiante</option>
                            <option>Intermedio</option>
                            <option>Avanzado</option>
                        </select>
                    </div>
                    <label style="font-size:.8rem">
                        <input type="checkbox" checked> Los alumnos podrán comentar
                    </label>
                </div>
            </div>
        </div>

        <div data-tab="v" class="tab-panel">
            <div class="box">
                <h3>Crear transmisión en vivo</h3>
                <div class="row2">
                    <div class="field">
                        <label>Título de la transmisión*</label>
                        <input placeholder="Escribe un título atractivo">
                        </input>
                    </div>
                    <div class="field">
                        <label>Categoría*</label>
                        <select>
                            <option value="">Selecciona una categoría</option>
                            <option>Agricultura</option>
                            <option>Medicina</option>
                            <option>Artesanías</option>
                            <option>Lenguas</option>
                            <option>Gastronomía</option>
                            <option>Deportes y juegos</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Descripción*</label>
                        <textarea placeholder="Cuéntanos de qué trata..."></textarea>
                    </div>
                    <div class="field">
                        <label>Etiquetas</label>
                        <input placeholder="Añade etiquetas">
                        </input>
                    </div>
                    <div class="field">
                        <label>Fecha*</label>
                        <input type="date">
                    </div>
                    <div class="field">
                        <label>Hora de inicio*</label>
                        <input type="time">
                    </div>
                    <div class="field">
                        <label>Duración estimada*</label>
                        <input placeholder="Ej. 1 hora">
                        </input>
                    </div>
                    <div class="field">
                        <label>Nivel de dificultad</label>
                        <select>
                            <option value="">Selecciona el nivel</option>
                            <option>Principiante</option>
                            <option>Intermedio</option>
                            <option>Avanzado</option>
                        </select>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div>

        <div class="box">

            <h3>Visibilidad</h3>

            <!-- Visibilidad options -->

        </div>

        <!-- Miniatura section -->

    </div>

</main>

<script src="./assiest/js/app.js"></script>

<script>

    document.querySelectorAll('.tabs').forEach(t=>t.querySelectorAll('button').forEach(b=>b.onclick=()=>{

        t.querySelectorAll('button').forEach(x=>x.classList.remove('on'));

        b.classList.add('on');

        document.querySelectorAll('[data-tab]').forEach(p=>p.classList.toggle('on',p.dataset.tab===b.dataset.t))

    }));

</script>

</body></html>
