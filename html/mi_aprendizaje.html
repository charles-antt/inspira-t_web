<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi aprendizaje | inspira-T</title>
    <link rel="icon" href="../assiest/images/isotipo_blanco.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assiest/css/styles.css">
    <link rel="stylesheet" href="../assiest/css/app.css">
</head>

<body class="app" data-page="mi_aprendizaje.html" data-role="aprendiente">
    <!-- Barra lateral izquierda -->
    <div id="sidebar-container"></div>

    <!-- Contenido principal -->
    <main class="main">
        <!-- Barra superior -->
        <div id="topbar-container"></div>

        <!-- Fila superior: 2 tarjetas de progreso + panel de certificados -->
        <div class="grid" style="grid-template-columns: 1fr 1fr 1.8fr; gap: 20px; align-items: stretch;">

            <!-- Tarjeta 1: Cursos en progreso -->
            <div class="panel"
                style="background: #f1f3f6; border: none; border-radius: 14px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                <div
                    style="width: 68px; height: 68px; border-radius: 50%; background: #1cd4b8; color: #ffffff; display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
                    <i data-lucide="pie-chart" style="width: 36px; height: 36px; stroke-width: 2;"></i>
                </div>
                <b style="font-size: 1.65rem; color: #1cd4b8; line-height: 1.1; margin-bottom: 8px;">12</b>
                <span style="font-size: 1rem; font-weight: 600; color: #1cd4b8; margin-bottom: 20px;">Cursos en
                    progreso</span>
                <div class="progress"
                    style="width: 85%; height: 14px; border-radius: 99px; background: #ffffff; border: 1px solid #1cd4b8;">
                    <i style="width: 85%; background: #1cd4b8; border-radius: 99px;"></i>
                </div>
            </div>

            <!-- Tarjeta 2: Cursos completados -->
            <div class="panel"
                style="background: #f1f3f6; border: none; border-radius: 14px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                <div
                    style="width: 68px; height: 68px; border-radius: 50%; background: #4e659c; color: #ffffff; display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
                    <i data-lucide="graduation-cap" style="width: 36px; height: 36px; stroke-width: 1.8;"></i>
                </div>
                <b style="font-size: 1.65rem; color: #263e75; line-height: 1.1; margin-bottom: 8px;">7</b>
                <span style="font-size: 1rem; font-weight: 600; color: #263e75; margin-bottom: 20px;">Cursos
                    completados</span>
                <div class="progress blue"
                    style="width: 85%; height: 14px; border-radius: 99px; background: #ffffff; border: 1px solid #4e659c;">
                    <i style="width: 78%; background: #4e659c; border-radius: 99px;"></i>
                </div>
            </div>

            <!-- Tarjeta 3: Mis certificados -->
            <div class="panel"
                style="background: #f1f3f6; border: none; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column;">
                <h3 style="margin: 0 0 14px 10px; font-size: 1.3rem; font-weight: 700; color: #1e293b;">Mis certificados
                </h3>
                <div
                    style="display: flex; flex-direction: column; gap: 12px; max-height: 225px; overflow-y: auto; padding-right: 8px;">

                    <div
                        style="background: #8ee6d8; color: #0f172a; border-radius: 8px; padding: 14px 18px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 14px;">
                        <i data-lucide="soup" style="width: 28px; height: 28px; stroke-width: 1.6; flex-shrink: 0;"></i>
                        <span>Herbolaria Ancestral</span>
                    </div>

                    <div
                        style="background: #b5afff; color: #0f172a; border-radius: 8px; padding: 14px 18px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 14px;">
                        <i data-lucide="amphora"
                            style="width: 28px; height: 28px; stroke-width: 1.6; flex-shrink: 0;"></i>
                        <span>Alfarería y cerámica</span>
                    </div>

                    <div
                        style="background: #82b5f7; color: #0f172a; border-radius: 8px; padding: 14px 18px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 14px;">
                        <i data-lucide="spool"
                            style="width: 28px; height: 28px; stroke-width: 1.6; flex-shrink: 0;"></i>
                        <span>Bordado tradicional</span>
                    </div>

                </div>
            </div>
        </div>

        <!-- Sección inferior: Últimos cursos vistos -->
        <h2 style="margin-top: 32px; margin-bottom: 18px; font-size: 1.3rem;">Últimos cursos vistos</h2>
        <div class="grid g2" style="gap: 24px 36px;">

            <!-- Curso 1 -->
            <div style="display: flex; gap: 16px; align-items: center;">
                <div class="thumb t1" style="width: 105px; height: 64px; flex-shrink: 0; border-radius: 6px;">
                    <img src="../assiest/images/herbolaria.svg" alt="Herbolaria Ancestral"
                        style="width: 100%; height: 100%; object-fit: cover; display: block;">
                </div>

                <div style="flex: 1;">
                    <div style="font-size: 1rem; font-weight: 600; color: #1e293b; margin-bottom: 10px;">Herbolaria
                        Ancestral</div>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <div class="progress"
                            style="flex: 1; height: 14px; border-radius: 99px; background: #ffffff; border: 1px solid #1cd4b8;">
                            <i style="width: 75%; background: #1cd4b8; border-radius: 99px;"></i>
                        </div>
                        <small
                            style="font-size: 0.78rem; font-weight: 600; color: #1e293b; min-width: 30px;">75%</small>
                    </div>
                </div>
            </div>

            <!-- Curso 2 -->
            <div style="display: flex; gap: 16px; align-items: center;">
                <div class="thumb t3" style="width: 105px; height: 64px; flex-shrink: 0; border-radius: 6px;">
                    <img src="../assiest/images/bordadoTradicional.svg" alt="Bordado tradicional"
                        style="width: 100%; height: 100%; object-fit: cover; display: block;">
                </div>
                <div style="flex: 1;">
                    <div style="font-size: 1rem; font-weight: 600; color: #1e293b; margin-bottom: 10px;">Bordado
                        tradicional</div>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <div class="progress"
                            style="flex: 1; height: 14px; border-radius: 99px; background: #ffffff; border: 1px solid #1cd4b8;">
                            <i style="width: 40%; background: #1cd4b8; border-radius: 99px;"></i>
                        </div>
                        <small
                            style="font-size: 0.78rem; font-weight: 600; color: #1e293b; min-width: 30px;">40%</small>
                    </div>
                </div>
            </div>

            <!-- Curso 3 -->
            <div style="display: flex; gap: 16px; align-items: center;">
                <div class="thumb t1" style="width: 105px; height: 64px; flex-shrink: 0; border-radius: 6px;">
                    <img src="../assiest/images/telar.svg" alt="Tejido en telar de cintura"
                        style="width: 100%; height: 100%; object-fit: cover; display: block;">
                </div>
                <div style="flex: 1;">
                    <div style="font-size: 1rem; font-weight: 600; color: #1e293b; margin-bottom: 10px;">Tejido en telar
                        de cintura</div>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <div class="progress"
                            style="flex: 1; height: 14px; border-radius: 99px; background: #ffffff; border: 1px solid #1cd4b8;">
                            <i style="width: 60%; background: #1cd4b8; border-radius: 99px;"></i>
                        </div>
                        <small
                            style="font-size: 0.78rem; font-weight: 600; color: #1e293b; min-width: 30px;">60%</small>
                    </div>
                </div>
            </div>

            <!-- Curso 4 -->
            <div style="display: flex; gap: 16px; align-items: center;">
                <div class="thumb t1" style="width: 105px; height: 64px; flex-shrink: 0; border-radius: 6px;">
                    <img src="../assiest/images/totonaco.svg" alt="Lengua zapoteca básica"
                        style="width: 100%; height: 100%; object-fit: cover; display: block;">
                </div>
                <div style="flex: 1;">
                    <div style="font-size: 1rem; font-weight: 600; color: #1e293b; margin-bottom: 10px;">Lengua zapoteca
                        básica</div>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <div class="progress"
                            style="flex: 1; height: 14px; border-radius: 99px; background: #ffffff; border: 1px solid #1cd4b8;">
                            <i style="width: 30%; background: #1cd4b8; border-radius: 99px;"></i>
                        </div>
                        <small
                            style="font-size: 0.78rem; font-weight: 600; color: #1e293b; min-width: 30px;">30%</small>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- API de Lucide Icons para renderizar SVGs -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../assiest/js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/topbar.js"></script>
</body>

</html>
